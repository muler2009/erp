name: ci
on:
  push: {branches: [main]}
  pull_request:
permissions: {contents: read}
concurrency: {group: "ci-${{ github.ref }}", cancel-in-progress: true}
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13", cache: pip, cache-dependency-path: "backend/requirements*.txt"}
      - run: pip install ruff==0.8.6
      - run: cd backend && ruff check .
      - name: Validate deployment files
        run: |
          pip install pyyaml
          python - <<'PY'
          import glob, json, yaml
          for f in glob.glob("infrastructure/**/*.y*ml", recursive=True) + ["docker-compose.yml", "docker-compose.observability.yml"]:
              list(yaml.safe_load_all(open(f)))
          json.load(open("infrastructure/monitoring/grafana/dashboards/erp-overview.json"))
          PY
      - run: bash -n infrastructure/backup/backup.sh infrastructure/backup/restore.sh infrastructure/backup/verify-restore.sh

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_PASSWORD: postgres}
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: config.settings_test
      DB_NAME: erp_dev
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: localhost
      DB_PORT: "5432"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13", cache: pip, cache-dependency-path: "backend/requirements*.txt"}
      - run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - run: cd backend && python manage.py makemigrations --check --dry-run
      - run: cd backend && python manage.py check --deploy --settings=config.settings_test || true   # informational; DEBUG is on in tests
      - run: cd backend && python -m pytest tests -q -p no:warnings

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: pip install pip-audit==2.7.3 bandit==1.8.0
      - run: pip-audit -r backend/requirements.txt
      - run: bandit -q -r backend -x backend/tests -ll -ii   # medium+ severity and confidence only
      - uses: gitleaks/gitleaks-action@v2
        env: {GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"}

  image:
    needs: [lint, test, security]
    runs-on: ubuntu-latest
    permissions: {contents: read, packages: write, security-events: write}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/Dockerfile.backend
          load: true
          tags: erp-backend:ci
      - uses: aquasecurity/trivy-action@0.28.0
        with: {image-ref: "erp-backend:ci", severity: "CRITICAL,HIGH", exit-code: "1", ignore-unfixed: true}
      - name: Push (main only)
        if: github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker tag erp-backend:ci ghcr.io/${{ github.repository }}/backend:${{ github.sha }}
          docker push ghcr.io/${{ github.repository }}/backend:${{ github.sha }}
