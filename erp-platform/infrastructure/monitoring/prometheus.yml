global: {scrape_interval: 15s, evaluation_interval: 15s}
rule_files: [/etc/prometheus/alerts.yml]
scrape_configs:
  - job_name: erp-backend
    metrics_path: /metrics
    authorization: {type: Bearer, credentials_file: /etc/prometheus/metrics_token}
    # /metrics answers on any Host (the pod IP included) and needs the bearer token.
    static_configs: [{targets: ["backend:8000"]}]
  - job_name: postgres
    static_configs: [{targets: ["postgres-exporter:9187"]}]
