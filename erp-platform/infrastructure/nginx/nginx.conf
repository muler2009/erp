# Preserves the Host header: the application resolves the tenant from it (never from client headers).
# TLS terminates here or at the load balancer in front; set ERP_BEHIND_PROXY=true in the application then.
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=perip:10m;

upstream erp_backend { server backend:8000; keepalive 16; }

server {
    listen 80;
    server_name .erp.localhost;
    server_tokens off;
    client_max_body_size 12m;           # a little above FILE_MAX_BYTES
    client_body_timeout 15s;
    proxy_read_timeout 60s;
    limit_conn perip 40;

    # Strip client-supplied tenant headers; the app ignores them as well (defence in depth).
    proxy_set_header X-Tenant-ID ""; proxy_set_header X-Tenant ""; proxy_set_header X-Tenant-Schema "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;   # overwrite, never append a client-supplied chain
    proxy_set_header X-Request-ID $request_id;
    proxy_http_version 1.1; proxy_set_header Connection "";

    # Operational endpoints are for the cluster network only.
    location = /metrics { return 404; }

    location /auth/ { limit_req zone=auth burst=10 nodelay; proxy_pass http://erp_backend; }
    location /api/  { limit_req zone=api burst=60 nodelay;  proxy_pass http://erp_backend; }
    location ~ ^/(admin|static|health|ready)(/|$) { proxy_pass http://erp_backend; }

    # The web app: hashed assets are cacheable forever; every other path falls back to index.html (client-side routing).
    root /usr/share/nginx/html;
    location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }
    location = /index.html { add_header Cache-Control "no-store"; }
    location / { try_files $uri /index.html; }
}
