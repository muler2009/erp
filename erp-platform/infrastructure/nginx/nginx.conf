# Preserves the Host header: the application resolves the tenant from it (never from client headers).
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
server {
    listen 80;
    server_name .erp.localhost;
    # Strip client-supplied tenant headers; the app ignores them as well (defence in depth).
    proxy_set_header X-Tenant-ID ""; proxy_set_header X-Tenant ""; proxy_set_header X-Tenant-Schema "";
    location /auth/ { limit_req zone=auth burst=10 nodelay; proxy_pass http://backend:8000; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
    location /      { proxy_pass http://backend:8000; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
}
