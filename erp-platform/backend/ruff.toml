# Correctness gate: syntax errors, undefined names, invalid comparisons. Style rules are not enforced here
# (the test fixtures re-import pytest fixtures on purpose, which style rules flag).
line-length = 200
target-version = "py313"
[lint]
select = ["E9", "F63", "F7", "F82", "B006", "B018", "S102", "S307", "S506"]
exclude = ["*/migrations/*"]
