# Development stack. Secrets come from .env (see .env.example).
services:
  postgres:
    image: postgres:16
    environment: {POSTGRES_DB: "${DB_NAME}", POSTGRES_USER: "${DB_USER}", POSTGRES_PASSWORD: "${DB_PASSWORD}"}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"], interval: 5s, retries: 10}
  redis:
    image: redis:7
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev --import-realm
    environment: {KC_BOOTSTRAP_ADMIN_USERNAME: admin, KC_BOOTSTRAP_ADMIN_PASSWORD: "${KEYCLOAK_ADMIN_PASSWORD:-admin}"}
    volumes: ["./infrastructure/keycloak:/opt/keycloak/data/import:ro"]
    ports: ["8080:8080"]
  backend:
    build: {context: ., dockerfile: infrastructure/docker/Dockerfile.backend}
    env_file: .env
    depends_on: {postgres: {condition: service_healthy}, redis: {condition: service_started}}
    command: >
      sh -c "python manage.py migrate_schemas --shared &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3"
  worker:
    build: {context: ., dockerfile: infrastructure/docker/Dockerfile.backend}
    env_file: .env
    depends_on: [backend]
    command: celery -A config worker -l info
  nginx:
    image: nginx:1.27
    volumes: ["./infrastructure/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro"]
    ports: ["80:80"]
    depends_on: [backend]
volumes:
  pgdata:
